<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102a43" />
    <title>法序 · 法考模拟</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app" class="app-shell"></div>
    <script>
      (() => {
        const version = Date.now().toString(36);
        // Optional cloud configuration. Fill these values for Supabase sync;
        // leaving functionsUrl empty keeps the offline/local mode working.
        window.__LAW_SUPABASE__ = window.__LAW_SUPABASE__ || { functionsUrl: 'https://nuyrjibjpzdcblnlteqx.supabase.co/functions/v1/law-api', anonKey: 'sb_publishable_Dx6p25rg7KxMtV4e3jBx7w_BMtKgOZC' };
        window.__LAW_ASSET_VERSION__ = version;
        const withVersion = (resourcePath) => `${resourcePath}?v=${encodeURIComponent(version)}`;
        const showLoadError = () => {
          document.querySelector('#app').innerHTML = '<main style="max-width:680px;margin:80px auto;padding:24px;font-family:system-ui,sans-serif">资源加载失败，请刷新页面重试。</main>';
        };

        const stylesheet = document.createElement('link');
        stylesheet.rel = 'stylesheet';
        stylesheet.href = withVersion('styles.css');
        stylesheet.onerror = showLoadError;
        document.head.appendChild(stylesheet);

        const loadApp = () => {
          const appScript = document.createElement('script');
          appScript.src = withVersion('app.js');
          appScript.onerror = showLoadError;
          document.body.appendChild(appScript);
        };
        const demoScript = document.createElement('script');
        demoScript.src = withVersion('data/demo.js');
        demoScript.onload = loadApp;
        demoScript.onerror = showLoadError;
        document.body.appendChild(demoScript);
      })();
    </script>
  </body>
</html>
